# This file provides examples of Klipper G-Code macros.  The snippets
# in this file may be copied into the main printer.cfg file and
# customized.

# See docs/Config_Reference.md for a description of parameters.


######################################################################
# Start Print and End Print
######################################################################

#####################################################################
#   A better print_start macro for v2/trident
#####################################################################

## *** THINGS TO UNCOMMENT: ***
## Bed mesh (2 lines at 2 locations)
## Nevermore (if you have one)
## Z_TILT_ADJUST (For Trident only)
## QUAD_GANTRY_LEVEL (For V2.4 only)
## Beacon Contact logic (if you have one. 4 lines at 4 locations)

[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("0")|int %}
  {% set filament_type = params.FILAMENT_TYPE|default('PLA')|string %}
  # {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  # {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% set x_wait = 10.0 %}
  {% set y_wait = 2.0 %}

  ##  Uncomment for Beacon Contact (1 of 4 for beacon contact)
  #SET_GCODE_OFFSET Z=0                                 # Set offset to 0

  # Home the printer, set absolute positioning and update the Stealthburner LEDs.
  STATUS_HOMING                                         # Set LEDs to homing-mode
  G28 X Y                                                   # Full home (XYZ)
  G90                                                   # Absolute position

  ##  Uncomment for bed mesh (1 of 2 for bed mesh)
  BED_MESH_CLEAR                                       # Clear old saved bed mesh (if any)

  # Check if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED|int > 90 and target_chamber > 0 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}°C"           # Display info on display
    STATUS_HEATING                                      # Set LEDs to heating-mode
    M106 S255                                           # Turn on the PT-fan

    ##  Uncomment if you have a Nevermore.
    #SET_PIN PIN=nevermore VALUE=1                      # Turn on the nevermore

    # G1 X{x_wait} Y{y_wait} Z15 F6000                    # Go to center of the bed
    M190 S{target_bed}                                  # Set the target temp for the bed
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}°C" # Display info on display
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}   # Waits for chamber temp

  # If the bed temp is not over 90c, then skip the heatsoak and just heat up to set temp with a 5 min soak
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}°C"           # Display info on display
    STATUS_HEATING                                      # Set LEDs to heating-mode
    # G1 X{x_wait} Y{y_wait} Z15 F5000                    # Go to center of the bed
    M190 S{target_bed}                                  # Set the target temp for the bed
    SET_DISPLAY_TEXT MSG="Soak for 2 min"               # Display info on display
    # G4 P300000                                          # Wait 5 min for the bedtemp to stabilize
    G4 S120
  {% endif %}

  # Heat hotend to 150c. This helps with getting a correct Z-home.
  # SET_DISPLAY_TEXT MSG="Hotend: 150°C"                   # Display info on display
  # M109 S150                                             # Heat hotend to 150c

  ##  Uncomment for Beacon contact (2 of 4 for beacon contact)
  #G28 Z METHOD=CONTACT CALIBRATE=1                     # Calibrate z offset and beacon model

  ##  Uncomment for Trident (Z_TILT_ADJUST)
  SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  STATUS_LEVELING                                      # Set LEDs to leveling-mode
  Z_TILT_ADJUST                                        # Level the printer via Z_TILT_ADJUST
  G28 Z                                                # Home Z again after Z_TILT_ADJUST

  ##  Uncomment for V2.4 (Quad gantry level AKA QGL)
  #SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  #STATUS_LEVELING                                      # Set LEDs to leveling-mode
  #QUAD_GANTRY_LEVEL                                    # Level the printer via QGL
  #G28 Z                                                # Home Z again after QGL

  ##  Uncomment for bed mesh (2 of 2 for bed mesh)
  #SET_DISPLAY_TEXT MSG="Bed mesh"                      # Display info on display
  #STATUS_MESHING                                       # Set LEDs to bed mesh-mode
  #BED_MESH_CALIBRATE                                   # Start the bed mesh (add ADAPTIVE=1) for adaptive bed mesh
  BED_MESH_PROFILE LOAD=default

  ## Uncomment for Beacon Contact (3 of 4 for beacon contact)
  #G28 Z METHOD=CONTACT CALIBRATE=0                     # Calibrate z offset only with hot nozzle

  # Heat up the hotend up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}°C"     # Display info on display
  STATUS_HEATING                                        # Set LEDs to heating-mode
  G1 X{x_wait} Y{y_wait} Z10 F6000                      # Go to center of the bed
  M107                                                  # Turn off partcooling fan
  M109 S{target_extruder}                               # Heat the hotend to set temp

  ##   Uncomment for Beacon Contact (4 of 4 for beacon contact)
  #SET_GCODE_OFFSET Z=0.06                              # Add a little offset for hotend thermal expansion
  
  # Thermal Expansion
  SET_GCODE_OFFSET Z=0.01

  # Get ready to print by doing a primeline and updating the LEDs
  SET_DISPLAY_TEXT MSG="Printer goes brr"               # Display info on display
  STATUS_PRINTING                                       # Set LEDs to printing-mode
  G0 X{x_wait + 10} Y{y_wait} Z0.4 F6000                           # Go to starting point
  G0 Z0.4                                               # Raise Z to 0.4
  G91                                                   # Incremental positioning 
  G1 X100 E20 F1000                                     # Primeline
  G90                                                   # Absolute position

[gcode_macro PRINT_END]
gcode:
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
    # Move nozzle away from print while retracting
    G91
    G1 X-2 Y-2 E-3 F300
    # Raise nozzle by 10mm
    G1 Z10 F3000
    G90
    # Present print
    G1 X0 Y200
    # Disable steppers
    M84

[gcode_macro STATUS_HOMING]
gcode:
    _LED_WHITE

[gcode_macro STATUS_HEATING]
gcode:
    _LED_RED

[gcode_macro STATUS_LEVELING]
gcode:
    _LED_BLUE

[gcode_macro STATUS_PRINTING]
gcode:
    _LED_WHITE

[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}  ; Wait for bed temp (within 1 degree)
    {% endif %}

[gcode_macro LOAD_FILAMENT]
variable_load_distance: 30                # Distance to load filament into the extruder
variable_purge_distance: 60               # Distance to purge filament after loading
variable_nozzle_preheat_temp: 200         # Default preheat temperature for the nozzle
variable_turn_off_extruder: True          # Option to turn off the extruder after loading (True/False)
variable_min_z_lift_height: 30            # Minimum Z height to lift to during loading
gcode:
    # === Parameter setup ===
    {% set load_speed = params.LOAD_SPEED|default(400) %}
    {% set purge_speed = params.PURGE_SPEED|default(150) %}
    {% set target_temp = params.TARGET_TEMP|default(nozzle_preheat_temp) %}
    {% set min_temp = params.MIN_TEMP|default(180) %}
    {% set safe_z = min_z_lift_height %}
    {% set current_z = printer.toolhead.position.z %}
    {% set z_homed = 'z' in printer.toolhead.homed_axes %}
    {% set z_should_lift = z_homed and current_z < safe_z %}
    {% set heater_power = printer.extruder.power %}
    {% set heater_target = printer.extruder.target %}
    {% set print_is_paused = (printer.print_stats.state == "paused") %}

    # === Save printer state ===
    SAVE_GCODE_STATE NAME=load_state

    # === Raise Z axis if needed ===
    {% if z_should_lift %}
        G91                         ; Relative positioning
        G1 Z{safe_z - current_z} F600 ; Lift Z to safe height
        G90                         ; Return to absolute positioning
    {% endif %}

    _MOVE_FILAMENT_HEATER_LOGIC TARGET_TEMP=target_temp MIN_TEMP=min_temp

    # === Load and purge filament ===
    G91
    G92 E0
    G1 E{load_distance} F{load_speed}
    G1 E{purge_distance} F{purge_speed}
    G1 E-2 F{purge_speed}
    G90

    # === Restore Z position if lifted ===
    {% if z_should_lift %}
        G1 Z{current_z} F600
    {% endif %}

    # === Optionally turn off extruder heater (only if NOT paused) ===
    {% if turn_off_extruder and not print_is_paused %}
        M104 S0
    {% endif %}

    # === Restore printer state ===
    RESTORE_GCODE_STATE NAME=load_state

    # === Completion message ===
    M117 Filament load complete

[gcode_macro _MOVE_FILAMENT_HEATER_LOGIC]
gcode:
    # Parameter setup
    {% set target_temp = params.TARGET_TEMP|default(200)|int %}
    {% set min_temp = params.MIN_TEMP|default(180)|int %}
    {% set heater_target = printer.extruder.target|int %}
    {% set heater_temp = printer.extruder.temperature|int %}
    {% set print_is_paused = (printer.print_stats.state == "paused") %}

    # Determine if the heater is active based on target or temperature
    {% set heater_active = (heater_target > 0) or (heater_temp >= min_temp) %}
    {% set debug_msg = "heater_target > 0: " ~ (heater_target > 0)|string %}
    RESPOND PREFIX="debug" MSG="{debug_msg}"
    {% set debug_msg = "heater_temp >= min_temp: " ~ (heater_temp >= min_temp)|string %}
    RESPOND PREFIX="debug" MSG="{debug_msg}"

    # Output debug info for diagnostics
    {% set debug_msg = "Heater target: " ~ heater_target|string ~ ", Heater temp: " ~ heater_temp|string ~ ", Heater active: " ~ heater_active|string %}
    RESPOND PREFIX="debug" MSG="{debug_msg}"

    # Initialize final_temp with the default or passed target value
    {% set final_temp = target_temp %}

    {% if heater_active %}
        {% if heater_target >= min_temp %}
            {% set final_temp = heater_target %}
            {% set msg = "Heater active: using target temp " ~ heater_target|string ~ "°C" %}
            RESPOND PREFIX="info" MSG="{msg}"
        {% elif heater_temp >= min_temp %}
            {% set final_temp = heater_temp %}
            {% set msg = "Heater active: using current temp " ~ heater_temp|string ~ "°C" %}
            RESPOND PREFIX="info" MSG="{msg}"
        {% else %}
            {% set final_temp = min_temp %}
            {% set msg = "Heater active but temps too low. Using min temp " ~ min_temp|string ~ "°C" %}
            RESPOND PREFIX="info" MSG="{msg}"
        {% endif %}
    {% elif target_temp < min_temp %}
        {% set final_temp = min_temp %}
    {% endif %}

    # Set and wait for final extrusion-safe temperature
    M104 S{final_temp}
    M109 S{final_temp}

[gcode_macro UNLOAD_FILAMENT]
description: "Unload filament with tip shaping"
variable_unload_distance: 50      # Distance to retract filament from the extruder
variable_nozzle_preheat_temp: 200  # Default preheat temperature for unloading
variable_turn_off_extruder: False   # Option to turn off the extruder after unloading (True/False)
gcode:
    # Parameters and settings
    {% set target_temp = params.TARGET_TEMP|default(nozzle_preheat_temp) %}  # Target temperature for the nozzle
    {% set min_temp = params.MIN_TEMP|default(180) %}  # Minimum safe temperature for extrusion
    {% set retract_length_tip = 14.0 %} # Volcano nozzle, use 5mm for V6
    {% set retract_length_total = 50.0 %}
    {% set retract_speed_fast = 30.0 %}
    {% set retract_speed_slow = 5.0 %}

    # Save current state of the printer
    SAVE_GCODE_STATE NAME=unload_state

    # # Heat the nozzle to the target temperature if required
    # {% if printer.extruder.temperature < target_temp %}
    #     # Ensure the nozzle is heated to the target temperature or at least the minimum safe temperature
    #     {% if target_temp >= min_temp %}
    #         M104 S{target_temp} ; Set extruder to target temperature
    #         M109 S{target_temp} ; Wait for extruder to reach target temperature
    #     {% else %}
    #         M104 S{min_temp} ; Set extruder to safe minimum temperature
    #         M109 S{min_temp} ; Wait for extruder to reach safe minimum temperature
    #     {% endif %}
    # {% endif %}
    _MOVE_FILAMENT_HEATER_LOGIC TARGET_TEMP=target_temp MIN_TEMP=min_temp

    # Begin filament unloading process
    G91 ; Set relative positioning for extrusion
    G92 E0 ; Reset extruder position

    # Slight extrude to ensure flow
    G1 E10.0 F300
    
    # Fast retract to shape tip
    G1 E-{retract_length_tip} F{retract_speed_fast * 60}
    
    # Pause to solidify tip slightly
    G4 S1
    
    # Slow retract to fully remove filament
    G1 E-{retract_length_total - retract_length_tip} F{retract_speed_slow * 60}

    # Optionally turn off the extruder heater after unloading
    {% if turn_off_extruder %}
        RESPOND PREFIX="info" MSG="UNLOAD_FILAMENT turn off the extruder heater"
        M104 S0 ; Turn off extruder heater
    {% endif %}

    # Restore previous state of the printer
    G90 ; Restore absolute positioning
    RESTORE_GCODE_STATE NAME=unload_state

    # Completion message
    M117 Filament unload complete


######################################################################
# Beeper
######################################################################

# M300 : Play tone. Beeper support, as commonly found on usual LCD
# displays (i.e. RepRapDiscount 2004 Smart Controller, RepRapDiscount
# 12864 Full Graphic). This defines a custom I/O pin and a custom
# GCODE macro.  Usage:
#   M300 [P<ms>] [S<Hz>]
#   P is the tone duration, S the tone frequency.
# The frequency won't be pitch perfect.

[pwm_cycle_time BEEPER_pin]
pin: ar37
#   Beeper pin. This parameter must be provided.
#   ar37 is the default RAMPS/MKS pin.
value: 0
#   Silent at power on, set to 1 if active low.
shutdown_value: 0
#   Disable at emergency shutdown (no PWM would be available anyway).
cycle_time: 0.001
#   Default PWM frequency : 0.001 = 1ms will give a tone of 1kHz
#   Although not pitch perfect.

[gcode_macro M300]
gcode:
    # Use a default 1kHz tone if S is omitted.
    {% set S = params.S|default(1000)|int %}
    # Use a 10ms duration is P is omitted.
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0


######################################################################
# Filament Change
######################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

[pause_resume]

[gcode_macro M600]
gcode:
    {% set X = params.X|default(0)|float %}
    {% set Y = params.Y|default(200)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    # G91
    # G1 E-.8 F2700
    # G1 Z{Z}
    # G90
    # G1 X{X} Y{Y} F3000
    # G91
    # G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state

######################################################################
# BMP280/BME280/BME680 Environmental Sensor
######################################################################

# The macro below assumes you have a BME280 sensor_type defined in one
# of the applicable sections in printer.cfg, such as:
#
#[temperature_sensor my_sensor]
#sensor_type: BME280
#gcode_id: AMB
#
# Note the format of the parameter SENSOR in the macro below.  The BME280
# sensor status can be accessed using the format "bme280 <section_name>".
# The example section above is named "my_sensor", thus the bme280 can be
# queried as follows:
#
# QUERY_BME280 SENSOR='bme280 my_sensor'
#
# Since a default parameter is defined one could simply enter QUERY_BME280
# as well.

[gcode_macro QUERY_BME280]
gcode:
    {% set sensor = printer["bme280 my_sensor"] %}
    {action_respond_info(
        "Temperature: %.2f C\n"
        "Pressure: %.2f hPa\n"
        "Humidity: %.2f%%" % (
            sensor.temperature,
            sensor.pressure,
            sensor.humidity))}

######################################################################
# HTU21D family Environmental Sensor
######################################################################

# The macro below assumes you have a HTU21D sensor_type defined in one
# of the applicable sections in printer.cfg, such as:
#
#[temperature_sensor my_sensor]
#sensor_type: HTU21D
#
# Note the format of the parameter SENSOR in the macro below.  The HTU21D
# sensor status can be accessed using the format "htu21d <section_name>".
# The example section above is named "my_sensor", thus the htu21d can be
# queried as follows:
#
# QUERY_HTU21D SENSOR='htu21d my_sensor'
#
# Since a default parameter is defined one could simply enter QUERY_HTU21D
# as well.

[gcode_macro QUERY_HTU21D]
gcode:
    {% set sensor = printer["htu21d my_sensor"] %}
    {action_respond_info(
        "Temperature: %.2f C\n"
        "Humidity: %.2f%%" % (
            sensor.temperature,
            sensor.humidity))}

######################################################################
# Override M117 command with rawparams
######################################################################

# The macro below will override the default M117 command to echo the message.
#
# It uses the rawparams pseudo-variable that contains the full unparsed
# parameters that was passed to the M117 command.
#
# As this can include comments, we are trimming the text when a `;` or `#` is
# found, and escaping any existing `"`

[gcode_macro M117]
rename_existing: M117.1
gcode:
  {% if rawparams %}
    {% set escaped_msg = rawparams.split(';', 1)[0].split('\x23', 1)[0]|replace('"', '\\"') %}
    SET_DISPLAY_TEXT MSG="{escaped_msg}"
    RESPOND TYPE=command MSG="{escaped_msg}"
  {% else %}
    SET_DISPLAY_TEXT
  {% endif %}

# SDCard 'looping' (aka Marlin M808 commands) support
#
# Support SDCard looping
[sdcard_loop]

# 'Marlin' style M808 compatibility macro for SDCard looping
[gcode_macro M808]
gcode:
    {% if params.K is not defined and params.L is defined %}SDCARD_LOOP_BEGIN COUNT={params.L|int}{% endif %}
    {% if params.K is not defined and params.L is not defined %}SDCARD_LOOP_END{% endif %}
    {% if params.K is defined and params.L is not defined %}SDCARD_LOOP_DESIST{% endif %}

# Cancel object (aka Marlin/RRF M486 commands) support
#
# Enable object exclusion
[exclude_object]

[gcode_macro M486]
gcode:
  # Parameters known to M486 are as follows:
  #   [C<flag>] Cancel the current object
  #   [P<index>] Cancel the object with the given index
  #   [S<index>] Set the index of the current object.
  #       If the object with the given index has been canceled, this will cause
  #       the firmware to skip to the next object. The value -1 is used to
  #       indicate something that isn’t an object and shouldn’t be skipped.
  #   [T<count>] Reset the state and set the number of objects
  #   [U<index>] Un-cancel the object with the given index. This command will be
  #       ignored if the object has already been skipped

  {% if 'exclude_object' not in printer %}
    {action_raise_error("[exclude_object] is not enabled")}
  {% endif %}

  {% if 'T' in params %}
    EXCLUDE_OBJECT RESET=1

    {% for i in range(params.T | int) %}
      EXCLUDE_OBJECT_DEFINE NAME={i}
    {% endfor %}
  {% endif %}

  {% if 'C' in params %}
    EXCLUDE_OBJECT CURRENT=1
  {% endif %}

  {% if 'P' in params %}
    EXCLUDE_OBJECT NAME={params.P}
  {% endif %}

  {% if 'S' in params %}
    {% if params.S == '-1' %}
      {% if printer.exclude_object.current_object %}
        EXCLUDE_OBJECT_END NAME={printer.exclude_object.current_object}
      {% endif %}
    {% else %}
      EXCLUDE_OBJECT_START NAME={params.S}
    {% endif %}
  {% endif %}

  {% if 'U' in params %}
    EXCLUDE_OBJECT RESET=1 NAME={params.U}
  {% endif %}

######################################################################
# G130: Set digital potentiometer value
######################################################################

# The macro below uses the MCP4018 SET_DIGIPOT command to implement
# a `G130` as used on classic Mightyboard-based printers such as
# The Makerbot Replicator 2/2X.
#
# The `G130` command can be used to lower the stepper current
# during preheating and raise the current again prior to starting
# the print.  This is necessary for printers with smaller power
# supplies that needed all the power to heat the bed.
#
# This macro requires one or more [mcp4018] configuration sections:
# (x_axis_pot, y_axis_pot, z_axis_pot, a_axis_pot, b_axis_pot)
#
# Example: G130 X20 Y20 Z20 A20 B20 ; Lower stepper Vrefs while heating

[gcode_macro G130]
gcode:
  M400
  {% if ('X' in params) and ('mcp4018 x_axis_pot' in printer.configfile.config) %}
    {% set x_value = params['X']|float %}
    {% set x_axis_pot_scale = printer.configfile.config["mcp4018 x_axis_pot"].scale|float %}
    SET_DIGIPOT DIGIPOT=x_axis_pot WIPER={ x_axis_pot_scale * (x_value / 127.0)}
  {% endif %}
  {% if ('Y' in params) and ('mcp4018 y_axis_pot' in printer.configfile.config) %}
    {% set y_value = params['Y']|float %}
    {% set y_axis_pot_scale = printer.configfile.config["mcp4018 y_axis_pot"].scale|float %}
    SET_DIGIPOT DIGIPOT=y_axis_pot WIPER={ y_axis_pot_scale * (y_value / 127.0)}
  {% endif %}
  {% if ('Z' in params) and ('mcp4018 z_axis_pot' in printer.configfile.config) %}
    {% set z_value = params['Z']|float %}
    {% set z_axis_pot_scale = printer.configfile.config["mcp4018 z_axis_pot"].scale|float %}
    SET_DIGIPOT DIGIPOT=z_axis_pot WIPER={ z_axis_pot_scale * (z_value / 127.0)}
  {% endif %}
  {% if ('A' in params) and ('mcp4018 a_axis_pot' in printer.configfile.config) %}
    {% set a_value = params['A']|float %}
    {% set a_axis_pot_scale = printer.configfile.config["mcp4018 a_axis_pot"].scale|float %}
    SET_DIGIPOT DIGIPOT=a_axis_pot WIPER={ a_axis_pot_scale * (a_value / 127.0)}
  {% endif %}
  {% if ('B' in params) and ('mcp4018 b_axis_pot' in printer.configfile.config) %}
    {% set b_value = params['B']|float %}
    {% set b_axis_pot_scale = printer.configfile.config["mcp4018 b_axis_pot"].scale|float %}
    SET_DIGIPOT DIGIPOT=b_axis_pot WIPER={ b_axis_pot_scale * (b_value / 127.0)}
  {% endif %}